name: Package EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Admin-Setup.ps1
      - Package-AdminSetup.ps1
      - .github/workflows/package-exe.yml

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build Admin-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Admin-Setup.ps1 -Package -OutFile "$PWD\dist\Admin-Setup.exe"
          Get-Item .\dist\Admin-Setup.exe | Format-List FullName, Length, LastWriteTime

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Setup-exe
          path: dist/Admin-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Admin Setup v1.1.0
          body: |
            Download **Admin-Setup.exe** below.

            Direct link: https://github.com/e24g4vewetq3gwerb/Admin-setup/releases/latest/download/Admin-Setup.exe

            Double-click the exe (UAC). Same switches as the script:
            `Admin-Setup.exe -Apply -UninstallNotKept -RestartIfNeeded`
          files: dist/Admin-Setup.exe
          make_latest: true
