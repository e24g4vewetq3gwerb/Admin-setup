name: Package EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Admin-Setup.ps1
      - Package-AdminSetup.ps1
      - .github/workflows/package-exe.yml

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build Admin-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Admin-Setup.ps1 -Package -OutFile "$PWD\dist\Admin-Setup.exe"
          Compress-Archive -Path "$PWD\dist\Admin-Setup.exe" -DestinationPath "$PWD\dist\Admin-Setup.zip" -Force
          Get-Item .\dist\Admin-Setup.exe, .\dist\Admin-Setup.zip | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Setup-exe
          path: |
            dist/Admin-Setup.exe
            dist/Admin-Setup.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Admin Setup v1.1.1
          body: |
            Prefer the zip if the browser blocks the raw exe.

            - [Admin-Setup.zip](https://github.com/e24g4vewetq3gwerb/Admin-setup/releases/latest/download/Admin-Setup.zip)
            - [Admin-Setup.exe](https://github.com/e24g4vewetq3gwerb/Admin-setup/releases/latest/download/Admin-Setup.exe)

            After extract: right-click exe -> Properties -> Unblock -> Apply.
            Then run as administrator.
          files: |
            dist/Admin-Setup.exe
            dist/Admin-Setup.zip
          make_latest: true
