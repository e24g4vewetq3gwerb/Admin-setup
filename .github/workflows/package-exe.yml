name: Package EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Admin-Setup.ps1
      - Package-AdminSetup.ps1
      - .github/workflows/package-exe.yml

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build Admin-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Admin-Setup.ps1 -Package -OutFile "$PWD\dist\Admin-Setup.exe"
          Get-Item .\dist\Admin-Setup.exe | Format-List FullName, Length, LastWriteTime

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Setup-exe
          path: dist/Admin-Setup.exe
          if-no-files-found: error
